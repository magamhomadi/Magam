<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مفكرتي">
  <title>مفكرة الإنجاز السريع</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316a34a'/%3E%3Cpath d='M18 22h28M18 32h20M18 42h14' stroke='%23fff' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M38 40l5 5 10-12' fill='none' stroke='%23dcfce7' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f8f7;
      --surface: #ffffff;
      --surface-2: #f1f5f2;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #16a34a;
      --primary-hover: #15803d;
      --primary-soft: #dcfce7;
      --primary-text: #166534;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --info: #2563eb;
      --info-soft: #dbeafe;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      --font: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f1412;
      --surface: #171e1b;
      --surface-2: #1f2924;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a3630;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --primary-soft: rgba(34, 197, 94, 0.16);
      --primary-text: #86efac;
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);
      --info: #60a5fa;
      --info-soft: rgba(96, 165, 250, 0.16);
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      padding: 14px 14px 32px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .net-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary-text);
    }

    .net-pill.offline {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 17px;
      transition: background 0.15s, border-color 0.15s;
    }

    .icon-btn:hover { background: var(--surface-2); }

    /* Progress Bar */
    .progress-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .progress-head strong { color: var(--text); font-size: 0.88rem; }

    .progress-track {
      height: 7px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    /* Stats / Status Tabs */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 9px 6px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
    }

    .stat-card:hover { background: var(--surface-2); }

    .stat-card.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .stat-num {
      display: block;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text);
    }

    .stat-card[data-filter="postponed"] .stat-num { color: var(--warn); }
    .stat-card[data-filter="done"] .stat-num { color: var(--primary); }

    .stat-lbl {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Composer */
    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .title-input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      padding: 4px 2px 9px;
      margin-bottom: 8px;
      outline: none;
    }

    .title-input::placeholder { color: var(--muted); font-weight: 500; }

    .note-textarea {
      width: 100%;
      min-height: 130px;
      max-height: 420px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    .note-textarea:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .editor-helpers {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 11px;
    }

    .helper-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn:hover { border-color: var(--primary); }

    .counter {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .composer-opts {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    select.ctrl, input.ctrl {
      height: 37px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 0 10px;
      outline: none;
    }

    select.ctrl:focus, input.ctrl:focus { border-color: var(--primary); }

    .toggle-chip {
      height: 37px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toggle-chip.urgent-on {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .toggle-chip.active-on {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      height: 38px;
      padding: 0 15px;
      border-radius: 10px;
      border: none;
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-warn {
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid rgba(217, 119, 6, 0.25);
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Toolbar (Search + Sequence Controls) */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 170px;
      font-size: 15px !important;
    }

    /* Notes List */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 13px 14px;
      box-shadow: var(--shadow);
      transition: transform 0.12s, border-color 0.15s;
    }

    .note-card.status-postponed { border-right-color: var(--warn); }
    .note-card.status-done {
      border-right-color: var(--muted);
      opacity: 0.78;
    }
    .note-card.is-urgent:not(.status-done) { border-right-color: var(--danger); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .seq-badge {
      background: var(--text);
      color: var(--surface);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--surface-2);
      color: var(--muted);
    }

    .pill-urgent { background: var(--danger-soft); color: var(--danger); }
    .pill-postponed { background: var(--warn-soft); color: var(--warn); }
    .pill-done { background: var(--primary-soft); color: var(--primary-text); }

    .order-arrows {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .arrow-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .arrow-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .note-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text);
    }

    .note-body {
      font-size: 0.95rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }

    .status-done .note-title,
    .status-done .note-body {
      text-decoration: line-through;
      color: var(--muted);
    }

    .postpone-reason {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
    }

    .note-date {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .act-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 9px;
      font-family: var(--font);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .act-btn.done-btn { color: var(--primary-text); background: var(--primary-soft); border-color: transparent; }
    .act-btn.warn-btn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
    .act-btn.del-btn { color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    /* Settings Dropdown */
    .menu-dropdown {
      position: absolute;
      top: 44px;
      left: 0;
      width: 245px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      padding: 6px;
      z-index: 50;
      display: none;
    }

    .menu-dropdown.open { display: block; }

    .menu-item {
      width: 100%;
      text-align: right;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-item:hover { background: var(--surface-2); }
    .menu-item.danger { color: var(--danger); }
    .menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.22s ease;
      z-index: 120;
      max-width: 92vw;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .toast-undo {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      .stats-grid { gap: 6px; }
      .composer-footer { flex-direction: column; align-items: stretch; }
      .composer-actions { justify-content: stretch; }
      .composer-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1>مفكرة الإنجاز</h1>
          <div class="brand-sub">
            <span id="versionLabel">إصدار 4.0</span>
            <span id="netPill" class="net-pill">متصل</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="copySummaryBtn" title="نسخ ملخص واتساب">📋</button>
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي والنهاري">🌙</button>
        <button class="icon-btn" id="menuBtn" title="الإعدادات والأدوات">⋮</button>

        <div class="menu-dropdown" id="settingsMenu">
          <button class="menu-item" id="installBtn" style="display:none;">📲 تثبيت كتطبيق على الجوال</button>
          <button class="menu-item" id="forceUpdateBtn">🔄 فحص التحديث ومسح الكاش</button>
          <button class="menu-item" id="downloadIconBtn">🖼️ تنزيل أيقونة icon-192.png</button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="exportBtn">⬇️ تصدير نسخة احتياطية JSON</button>
          <button class="menu-item" id="importBtn">⬆️ استيراد نسخة احتياطية</button>
          <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
          <div class="menu-sep"></div>
          <button class="menu-item danger" id="clearDoneBtn">🗑️ مسح المهام المكتملة</button>
        </div>
      </div>
    </header>

    <section class="progress-wrap">
      <div class="progress-head">
        <span>نسبة إغلاق المهام</span>
        <strong id="progressText">0% (0 / 0)</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="stats-grid" id="statsGrid">
      <button class="stat-card active" data-filter="all">
        <span class="stat-num" id="cntAll">0</span>
        <span class="stat-lbl">الكل</span>
      </button>
      <button class="stat-card" data-filter="active">
        <span class="stat-num" id="cntActive">0</span>
        <span class="stat-lbl">قيد التنفيذ</span>
      </button>
      <button class="stat-card" data-filter="postponed">
        <span class="stat-num" id="cntPostponed">0</span>
        <span class="stat-lbl">مؤجلة</span>
      </button>
      <button class="stat-card" data-filter="done">
        <span class="stat-num" id="cntDone">0</span>
        <span class="stat-lbl">مكتملة</span>
      </button>
    </section>

    <section class="composer">
      <input type="text" id="noteTitle" class="title-input" placeholder="عنوان مختصر (اختياري)...">
      <textarea id="noteInput" class="note-textarea" placeholder="اكتب ملاحظتك أو مهمتك هنا... (اضغط Ctrl+Enter للحفظ السريع)"></textarea>

      <div class="editor-helpers">
        <div class="helper-btns">
          <button type="button" class="mini-btn" id="btnNumbering">1. ترقيم تلقائي</button>
          <button type="button" class="mini-btn" id="btnBullets">• نقاط</button>
          <button type="button" class="mini-btn" id="btnClearEditor">مسح الحقل</button>
        </div>
        <span class="counter" id="editorCounter">0 أسطر • 0 حرف</span>
      </div>

      <div class="composer-footer">
        <div class="composer-opts">
          <select id="noteCategory" class="ctrl" aria-label="التصنيف">
            <option value="عام">عام</option>
            <option value="ديون">ديون</option>
            <option value="فواتير">فواتير</option>
            <option value="عمل">عمل</option>
            <option value="برمجة">برمجة</option>
            <option value="شخصي">شخصي</option>
          </select>
          <button type="button" id="urgentToggle" class="toggle-chip">🔥 عاجل</button>
        </div>

        <div class="composer-actions">
          <button type="button" id="savePostponedBtn" class="btn btn-warn">⏳ حفظ كمؤجلة</button>
          <button type="button" id="saveBtn" class="btn btn-primary">＋ حفظ المهمة</button>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-row">
        <input type="search" id="searchInput" class="ctrl search-input" placeholder="🔍 بحث سريع في الملاحظات والديون...">
        <select id="catFilter" class="ctrl" aria-label="فلترة بالتصنيف">
          <option value="all">كل التصنيفات</option>
          <option value="عام">عام</option>
          <option value="ديون">ديون</option>
          <option value="فواتير">فواتير</option>
          <option value="عمل">عمل</option>
          <option value="برمجة">برمجة</option>
          <option value="شخصي">شخصي</option>
        </select>
      </div>

      <div class="toolbar-row">
        <select id="sortMode" class="ctrl" aria-label="طريقة التسلسل">
          <option value="manual">التسلسل: يدوي مخصص</option>
          <option value="newest">التسلسل: الأحدث أولاً</option>
          <option value="oldest">التسلسل: الأقدم أولاً</option>
          <option value="urgent">التسلسل: العاجل أولاً</option>
          <option value="status">التسلسل: حسب الحالة</option>
        </select>
        <button type="button" id="seqToggleBtn" class="toggle-chip active-on"># إظهار الترقيم</button>
        <button type="button" id="reverseBtn" class="toggle-chip">⇅ عكس الترتيب</button>
        <button type="button" id="urgentFilterBtn" class="toggle-chip">🔥 العاجل فقط</button>
      </div>
    </section>

    <main id="notesList" class="notes-list"></main>
  </div>

  <!-- Edit Modal -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h2>تعديل الملاحظة</h2>
      <input type="text" id="editTitle" class="title-input" placeholder="العنوان (اختياري)...">
      <textarea id="editText" class="note-textarea" style="min-height:140px;margin-bottom:10px;"></textarea>
      <div class="toolbar-row" style="margin-bottom:10px;">
        <select id="editCategory" class="ctrl">
          <option value="عام">عام</option>
          <option value="ديون">ديون</option>
          <option value="فواتير">فواتير</option>
          <option value="عمل">عمل</option>
          <option value="برمجة">برمجة</option>
          <option value="شخصي">شخصي</option>
        </select>
        <select id="editStatus" class="ctrl">
          <option value="active">قيد التنفيذ</option>
          <option value="postponed">مؤجلة</option>
          <option value="done">مكتملة</option>
        </select>
        <button type="button" id="editUrgentToggle" class="toggle-chip">🔥 عاجل</button>
      </div>
      <input type="text" id="editReason" class="ctrl" style="width:100%;" placeholder="سبب التأجيل (اختياري)...">
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="closeEditBtn">إلغاء</button>
        <button type="button" class="btn btn-primary" id="saveEditBtn">حفظ التعديلات</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button type="button" class="toast-undo" id="toastUndo" style="display:none;">تراجع</button>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'note_app_v4_tasks';
      const PREFS_KEY = 'note_app_v4_prefs';

      let tasks = [];
      let prefs = {
        theme: 'light',
        filter: 'all',
        catFilter: 'all',
        urgentOnly: false,
        sortMode: 'manual',
        showSeq: true,
        reversed: false
      };

      let isUrgentNew = false;
      let editingId = null;
      let editUrgent = false;
      let lastDeleted = null;
      let toastTimer = null;
      let deferredPrompt = null;

      // Elements
      const el = (id) => document.getElementById(id);
      const noteTitle = el('noteTitle');
      const noteInput = el('noteInput');
      const noteCategory = el('noteCategory');
      const urgentToggle = el('urgentToggle');
      const editorCounter = el('editorCounter');
      const searchInput = el('searchInput');
      const catFilter = el('catFilter');
      const sortMode = el('sortMode');
      const seqToggleBtn = el('seqToggleBtn');
      const reverseBtn = el('reverseBtn');
      const urgentFilterBtn = el('urgentFilterBtn');
      const notesList = el('notesList');
      const settingsMenu = el('settingsMenu');
      const editModal = el('editModal');
      const netPill = el('netPill');

      // Load & Migrate Data
      function loadData() {
        try {
          const savedPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
          if (savedPrefs) prefs = Object.assign(prefs, savedPrefs);
        } catch (e) {}

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            tasks = JSON.parse(raw);
          } else {
            // Migrate from older versions if present
            const legacyKeys = ['quick_notes_v2', 'quick_notes_tasks_v1', 'notes_tasks_data', 'tasks'];
            for (const k of legacyKeys) {
              const old = localStorage.getItem(k);
              if (old) {
                const parsed = JSON.parse(old);
                if (Array.isArray(parsed) && parsed.length) {
                  tasks = parsed.map((t, i) => ({
                    id: t.id || ('t_' + Date.now() + '_' + i),
                    title: t.title || '',
                    text: t.text || t.content || '',
                    category: t.category || 'عام',
                    status: t.status || (t.completed ? 'done' : 'active'),
                    urgent: Boolean(t.urgent),
                    reason: t.reason || t.postponeReason || '',
                    order: typeof t.order === 'number' ? t.order : i,
                    createdAt: t.createdAt || Date.now(),
                    updatedAt: t.updatedAt || Date.now()
                  }));
                  saveTasks();
                  break;
                }
              }
            }
          }
        } catch (e) {
          tasks = [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function savePrefs() {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      }

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', prefs.theme);
        el('themeBtn').textContent = prefs.theme === 'dark' ? '☀️' : '🌙';
      }

      function updateNetStatus() {
        if (navigator.onLine) {
          netPill.textContent = 'متصل';
          netPill.classList.remove('offline');
        } else {
          netPill.textContent = 'وضع أوفلاين ✓';
          netPill.classList.add('offline');
        }
      }

      function showToast(msg, allowUndo = false) {
        clearTimeout(toastTimer);
        el('toastMsg').textContent = msg;
        el('toastUndo').style.display = allowUndo ? 'inline-block' : 'none';
        el('toast').classList.add('show');
        toastTimer = setTimeout(() => {
          el('toast').classList.remove('show');
          lastDeleted = null;
        }, 4500);
      }

      function updateCounter() {
        const val = noteInput.value;
        const lines = val ? val.split('\n').length : 0;
        editorCounter.textContent = `${lines} أسطر • ${val.length} حرف`;
        noteInput.style.height = 'auto';
        noteInput.style.height = Math.max(130, Math.min(noteInput.scrollHeight, 400)) + 'px';
      }

      function addTask(status = 'active') {
        const text = noteInput.value.trim();
        const title = noteTitle.value.trim();
        if (!text && !title) {
          showToast('اكتب ملاحظة أولاً قبل الحفظ');
          noteInput.focus();
          return;
        }

        const minOrder = tasks.length ? Math.min(...tasks.map(t => t.order ?? 0)) - 1 : 0;
        const now = Date.now();
        tasks.unshift({
          id: 'n_' + now + '_' + Math.random().toString(36).slice(2, 6),
          title,
          text,
          category: noteCategory.value,
          status,
          urgent: isUrgentNew,
          reason: '',
          order: minOrder,
          createdAt: now,
          updatedAt: now
        });

        noteTitle.value = '';
        noteInput.value = '';
        isUrgentNew = false;
        urgentToggle.classList.remove('urgent-on');
        updateCounter();
        saveTasks();
        render();
        showToast(status === 'postponed' ? 'تم الحفظ في المؤجلة ⏳' : 'تم حفظ المهمة ✓');
      }

      // Smart List / Auto-numbering in Editor
      function insertListPrefix(type) {
        const val = noteInput.value;
        const pos = noteInput.selectionStart;
        const before = val.slice(0, pos);
        const after = val.slice(pos);
        const lines = before.split('\n');
        const currentLine = lines[lines.length - 1];

        let insert = '';
        if (type === 'num') {
          let nextNum = 1;
          for (let i = lines.length - 1; i >= 0; i--) {
            const m = lines[i].match(/^\s*(\d+)\.\s*/);
            if (m) { nextNum = parseInt(m[1], 10) + 1; break; }
          }
          insert = (currentLine.trim() === '' ? '' : '\n') + nextNum + '. ';
        } else {
          insert = (currentLine.trim() === '' ? '' : '\n') + '• ';
        }

        noteInput.value = before + insert + after;
        const newPos = pos + insert.length;
        noteInput.setSelectionRange(newPos, newPos);
        noteInput.focus();
        updateCounter();
      }

      noteInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          addTask('active');
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          const pos = noteInput.selectionStart;
          const before = noteInput.value.slice(0, pos);
          const after = noteInput.value.slice(pos);
          const lineStart = before.lastIndexOf('\n') + 1;
          const currentLine = before.slice(lineStart);

          const numMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
          if (numMatch) {
            e.preventDefault();
            if (numMatch[3].trim() === '') {
              noteInput.value = before.slice(0, lineStart) + after;
              noteInput.setSelectionRange(lineStart, lineStart);
            } else {
              const next = `\n${numMatch[1]}${parseInt(numMatch[2], 10) + 1}. `;
              noteInput.value = before + next + after;
              noteInput.setSelectionRange(pos + next.length, pos + next.length);
            }
            updateCounter();
            return;
          }

          const bulMatch = currentLine.match(/^(\s*)[•\-]\s+(.*)$/);
          if (bulMatch) {
            e.preventDefault();
            if (bulMatch[2].trim() === '') {
              noteInput.value = before.slice(0, lineStart) + after;
              noteInput.setSelectionRange(lineStart, lineStart);
            } else {
              const next = `\n${bulMatch[1]}• `;
              noteInput.value = before + next + after;
              noteInput.setSelectionRange(pos + next.length, pos + next.length);
            }
            updateCounter();
          }
        }
      });

      function getFilteredSortedTasks() {
        const q = searchInput.value.trim().toLowerCase();
        let list = tasks.filter(t => {
          if (prefs.filter !== 'all' && t.status !== prefs.filter) return false;
          if (prefs.catFilter !== 'all' && t.category !== prefs.catFilter) return false;
          if (prefs.urgentOnly && !t.urgent) return false;
          if (q) {
            const hay = `${t.title} ${t.text} ${t.category} ${t.reason}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const statusRank = { active: 0, postponed: 1, done: 2 };
        list.sort((a, b) => {
          if (prefs.sortMode === 'manual') return (a.order ?? 0) - (b.order ?? 0);
          if (prefs.sortMode === 'newest') return b.createdAt - a.createdAt;
          if (prefs.sortMode === 'oldest') return a.createdAt - b.createdAt;
          if (prefs.sortMode === 'urgent') {
            if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
            return b.createdAt - a.createdAt;
          }
          if (prefs.sortMode === 'status') {
            if (statusRank[a.status] !== statusRank[b.status]) return statusRank[a.status] - statusRank[b.status];
            return b.createdAt - a.createdAt;
          }
          return 0;
        });

        if (prefs.reversed) list.reverse();
        return list;
      }

      function moveTask(id, dir) {
        const visible = getFilteredSortedTasks();
        const idx = visible.findIndex(t => t.id === id);
        const targetIdx = idx + dir;
        if (idx === -1 || targetIdx < 0 || targetIdx >= visible.length) return;

        // Lock current order into manual mode
        if (prefs.sortMode !== 'manual' || prefs.reversed) {
          visible.forEach((t, i) => { t.order = i; });
          const rest = tasks.filter(t => !visible.includes(t));
          rest.forEach((t, i) => { t.order = visible.length + i; });
          prefs.sortMode = 'manual';
          prefs.reversed = false;
          sortMode.value = 'manual';
          reverseBtn.classList.remove('active-on');
          savePrefs();
        }

        const a = visible[idx];
        const b = visible[targetIdx];
        const tmp = a.order;
        a.order = b.order;
        b.order = tmp;
        if (a.order === b.order) {
          visible.forEach((t, i) => { t.order = i; });
          a.order = targetIdx;
          b.order = idx;
        }
        saveTasks();
        render();
      }

      function escapeHTML(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDate(ts) {
        try {
          return new Date(ts).toLocaleString('ar-YE', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
        } catch (e) {
          return new Date(ts).toLocaleDateString();
        }
      }

      function render() {
        const total = tasks.length;
        const active = tasks.filter(t => t.status === 'active').length;
        const postponed = tasks.filter(t => t.status === 'postponed').length;
        const done = tasks.filter(t => t.status === 'done').length;

        el('cntAll').textContent = total;
        el('cntActive').textContent = active;
        el('cntPostponed').textContent = postponed;
        el('cntDone').textContent = done;

        const pct = total ? Math.round((done / total) * 100) : 0;
        el('progressText').textContent = `${pct}% (${done} / ${total})`;
        el('progressFill').style.width = pct + '%';

        document.querySelectorAll('.stat-card').forEach(card => {
          card.classList.toggle('active', card.dataset.filter === prefs.filter);
        });

        sortMode.value = prefs.sortMode;
        catFilter.value = prefs.catFilter;
        seqToggleBtn.classList.toggle('active-on', prefs.showSeq);
        reverseBtn.classList.toggle('active-on', prefs.reversed);
        urgentFilterBtn.classList.toggle('urgent-on', prefs.urgentOnly);

        const list = getFilteredSortedTasks();
        if (!list.length) {
          notesList.innerHTML = `<div class="empty-state">لا توجد ملاحظات في هذا القسم حالياً.</div>`;
          return;
        }

        notesList.innerHTML = list.map((t, idx) => {
          const seqNum = String(idx + 1).padStart(2, '0');
          const statusBadge = t.status === 'done'
            ? `<span class="pill pill-done">مكتملة</span>`
            : t.status === 'postponed'
              ? `<span class="pill pill-postponed">مؤجلة</span>`
              : '';

          return `
            <article class="note-card status-${t.status} ${t.urgent ? 'is-urgent' : ''}" data-id="${t.id}">
              <div class="card-top">
                <div class="card-meta">
                  ${prefs.showSeq ? `<span class="seq-badge">#${seqNum}</span>` : ''}
                  <span class="pill">${escapeHTML(t.category)}</span>
                  ${t.urgent ? `<span class="pill pill-urgent">🔥 عاجل</span>` : ''}
                  ${statusBadge}
                </div>
                <div class="order-arrows">
                  <button class="arrow-btn" data-act="up" ${idx === 0 ? 'disabled' : ''} title="تحريك للأعلى">▲</button>
                  <button class="arrow-btn" data-act="down" ${idx === list.length - 1 ? 'disabled' : ''} title="تحريك للأسفل">▼</button>
                </div>
              </div>
              ${t.title ? `<div class="note-title">${escapeHTML(t.title)}</div>` : ''}
              ${t.text ? `<div class="note-body">${escapeHTML(t.text)}</div>` : ''}
              ${t.status === 'postponed' && t.reason ? `<div class="postpone-reason">سبب التأجيل: ${escapeHTML(t.reason)}</div>` : ''}
              <div class="card-bottom">
                <span class="note-date">${formatDate(t.createdAt)}</span>
                <div class="card-actions">
                  <button class="act-btn done-btn" data-act="toggleDone">${t.status === 'done' ? '↩ إعادة فتح' : '✓ إكمال'}</button>
                  ${t.status !== 'done' ? `<button class="act-btn warn-btn" data-act="postpone">${t.status === 'postponed' ? '▶ تفعيل' : '⏳ تأجيل'}</button>` : ''}
                  <button class="act-btn" data-act="edit">✎ تعديل</button>
                  <button class="act-btn del-btn" data-act="delete">✕</button>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Card Actions Delegation
      notesList.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const card = btn.closest('.note-card');
        const id = card.dataset.id;
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        const act = btn.dataset.act;
        if (act === 'up') moveTask(id, -1);
        else if (act === 'down') moveTask(id, 1);
        else if (act === 'toggleDone') {
          task.status = task.status === 'done' ? 'active' : 'done';
          task.updatedAt = Date.now();
          saveTasks();
          render();
          showToast(task.status === 'done' ? 'أُغلقت المهمة بنجاح ✓' : 'تمت إعادة فتح المهمة');
        } else if (act === 'postpone') {
          if (task.status === 'postponed') {
            task.status = 'active';
            task.reason = '';
          } else {
            const reason = prompt('سبب التأجيل (اختياري، يمكنك تركه فارغاً):', task.reason || '');
            if (reason === null) return;
            task.status = 'postponed';
            task.reason = reason.trim();
          }
          task.updatedAt = Date.now();
          saveTasks();
          render();
        } else if (act === 'edit') {
          editingId = id;
          el('editTitle').value = task.title || '';
          el('editText').value = task.text || '';
          el('editCategory').value = task.category || 'عام';
          el('editStatus').value = task.status || 'active';
          el('editReason').value = task.reason || '';
          editUrgent = Boolean(task.urgent);
          el('editUrgentToggle').classList.toggle('urgent-on', editUrgent);
          editModal.classList.add('open');
        } else if (act === 'delete') {
          const index = tasks.findIndex(t => t.id === id);
          lastDeleted = { task, index };
          tasks.splice(index, 1);
          saveTasks();
          render();
          showToast('تم حذف الملاحظة', true);
        }
      });

      // UI Events
      el('saveBtn').addEventListener('click', () => addTask('active'));
      el('savePostponedBtn').addEventListener('click', () => addTask('postponed'));
      el('btnNumbering').addEventListener('click', () => insertListPrefix('num'));
      el('btnBullets').addEventListener('click', () => insertListPrefix('bul'));
      el('btnClearEditor').addEventListener('click', () => {
        noteTitle.value = '';
        noteInput.value = '';
        updateCounter();
        noteInput.focus();
      });

      noteInput.addEventListener('input', updateCounter);

      urgentToggle.addEventListener('click', () => {
        isUrgentNew = !isUrgentNew;
        urgentToggle.classList.toggle('urgent-on', isUrgentNew);
      });

      el('statsGrid').addEventListener('click', (e) => {
        const card = e.target.closest('.stat-card');
        if (!card) return;
        prefs.filter = card.dataset.filter;
        savePrefs();
        render();
      });

      searchInput.addEventListener('input', render);
      catFilter.addEventListener('change', () => { prefs.catFilter = catFilter.value; savePrefs(); render(); });
      sortMode.addEventListener('change', () => { prefs.sortMode = sortMode.value; savePrefs(); render(); });
      seqToggleBtn.addEventListener('click', () => { prefs.showSeq = !prefs.showSeq; savePrefs(); render(); });
      reverseBtn.addEventListener('click', () => { prefs.reversed = !prefs.reversed; savePrefs(); render(); });
      urgentFilterBtn.addEventListener('click', () => { prefs.urgentOnly = !prefs.urgentOnly; savePrefs(); render(); });

      // Edit Modal
      el('editUrgentToggle').addEventListener('click', () => {
        editUrgent = !editUrgent;
        el('editUrgentToggle').classList.toggle('urgent-on', editUrgent);
      });
      el('closeEditBtn').addEventListener('click', () => editModal.classList.remove('open'));
      editModal.addEventListener('click', (e) => { if (e.target === editModal) editModal.classList.remove('open'); });
      el('saveEditBtn').addEventListener('click', () => {
        const task = tasks.find(t => t.id === editingId);
        if (!task) return;
        task.title = el('editTitle').value.trim();
        task.text = el('editText').value.trim();
        task.category = el('editCategory').value;
        task.status = el('editStatus').value;
        task.reason = el('editReason').value.trim();
        task.urgent = editUrgent;
        task.updatedAt = Date.now();
        saveTasks();
        editModal.classList.remove('open');
        render();
        showToast('تم حفظ التعديل ✓');
      });

      // Undo Delete
      el('toastUndo').addEventListener('click', () => {
        if (!lastDeleted) return;
        tasks.splice(lastDeleted.index, 0, lastDeleted.task);
        lastDeleted = null;
        saveTasks();
        render();
        el('toast').classList.remove('show');
      });

      // Theme & Menu
      el('themeBtn').addEventListener('click', () => {
        prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark';
        savePrefs();
        applyTheme();
      });

      el('menuBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        settingsMenu.classList.toggle('open');
      });
      document.addEventListener('click', () => settingsMenu.classList.remove('open'));

      // Copy WhatsApp Summary
      el('copySummaryBtn').addEventListener('click', async () => {
        const active = tasks.filter(t => t.status === 'active');
        const postponed = tasks.filter(t => t.status === 'postponed');
        const done = tasks.filter(t => t.status === 'done');
        const fmt = (arr) => arr.map((t, i) => `${i + 1}. ${t.urgent ? '🔥 ' : ''}[${t.category}] ${t.title ? t.title + ': ' : ''}${t.text}`).join('\n');

        let out = `📋 *ملخص مفكرة الإنجاز*\n`;
        if (active.length) out += `\n🟢 *قيد التنفيذ (${active.length}):*\n${fmt(active)}\n`;
        if (postponed.length) out += `\n⏳ *مؤجلة (${postponed.length}):*\n${fmt(postponed)}\n`;
        if (done.length) out += `\n✅ *مكتملة (${done.length}):*\n${fmt(done)}\n`;

        try {
          await navigator.clipboard.writeText(out);
          showToast('تم نسخ الملخص الجاهز لواتساب ✓');
        } catch (e) {
          showToast('تعذر النسخ التلقائي');
        }
      });

      // Export & Import JSON
      el('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `note-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('تم تنزيل النسخة الاحتياطية');
      });

      el('importBtn').addEventListener('click', () => el('importFile').click());
      el('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!Array.isArray(imported)) throw new Error();
            tasks = imported;
            saveTasks();
            render();
            showToast(`تم استيراد ${tasks.length} ملاحظة ✓`);
          } catch (err) {
            showToast('ملف النسخة الاحتياطية غير صالح');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      el('clearDoneBtn').addEventListener('click', () => {
        const count = tasks.filter(t => t.status === 'done').length;
        if (!count) return showToast('لا توجد مهام مكتملة للمسح');
        if (!confirm(`مسح ${count} مهمة مكتملة نهائياً؟`)) return;
        tasks = tasks.filter(t => t.status !== 'done');
        saveTasks();
        render();
        showToast('تم تنظيف المهام المكتملة ✓');
      });

      // Generate PNG Icon (icon-192.png) for GitHub upload
      el('downloadIconBtn').addEventListener('click', () => {
        const c = document.createElement('canvas');
        c.width = 192;
        c.height = 192;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.roundRect(0, 0, 192, 192, 42);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(48, 62); ctx.lineTo(144, 62);
        ctx.moveTo(48, 96); ctx.lineTo(116, 96);
        ctx.moveTo(48, 130); ctx.lineTo(94, 130);
        ctx.stroke();

        ctx.strokeStyle = '#dcfce7';
        ctx.beginPath();
        ctx.moveTo(114, 122); ctx.lineTo(132, 140); ctx.lineTo(160, 102);
        ctx.stroke();

        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'icon-192.png';
        a.click();
        showToast('تم تنزيل icon-192.png — ارفعه بجانب Note.html');
      });

      // Force Update & Clear Cache
      el('forceUpdateBtn').addEventListener('click', async () => {
        if (!navigator.onLine) {
          showToast('اتصل بالإنترنت أولاً لفحص التحديثات');
          return;
        }
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          showToast('تم مسح الكاش.. جاري التحديث');
          setTimeout(() => {
            window.location.href = window.location.pathname + '?v=' + Date.now();
          }, 500);
        } catch (err) {
          window.location.reload();
        }
      });

      // PWA Install Prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        el('installBtn').style.display = 'flex';
      });

      el('installBtn').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        el('installBtn').style.display = 'none';
      });

      // Register Service Worker
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => reg.update())
            .catch(err => console.warn('SW registration skipped:', err));
        });
      }

      window.addEventListener('online', updateNetStatus);
      window.addEventListener('offline', updateNetStatus);

      // Init
      loadData();
      applyTheme();
      updateNetStatus();
      updateCounter();
      render();
    })();
  </script>
</body>
</html>
