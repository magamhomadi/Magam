      /* ----------------------------------------------------------------------
         Event Listeners Setup
         ---------------------------------------------------------------------- */
      function bindEvents() {
        // Populate Edit Category Select
        els.editCategory.innerHTML = CATEGORIES.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');

        // Theme Toggle
        els.btnThemeToggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Header Tools & Summary
        els.btnCopySummary.addEventListener('click', handleCopySummary);
        els.btnToolsMenu.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleToolsMenu();
        });
        els.btnExportJson.addEventListener('click', handleExportJson);
        els.btnImportJson.addEventListener('click', () => {
          closeToolsMenu();
          els.importFileInput.click();
        });
        els.importFileInput.addEventListener('change', handleImportFileSelected);
        els.btnClearCompleted.addEventListener('click', requestClearCompleted);

        // Close Dropdown on Outside Click
        document.addEventListener('click', (e) => {
          if (!els.toolsDropdown.contains(e.target) && !els.btnToolsMenu.contains(e.target)) {
            closeToolsMenu();
          }
        });

        // Quick Capture Form Submit
        els.captureForm.addEventListener('submit', (e) => {
          e.preventDefault();
          addNote(els.captureInput.value);
        });

        // Capture Category Chips
        els.captureCategories.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-capture-cat]');
          if (!btn) return;
          state.captureCategory = btn.dataset.captureCat;
          renderCaptureCategories();
          els.captureInput.focus();
        });

        // Capture Urgent & Initial Status Toggles
        els.btnToggleUrgent.addEventListener('click', () => {
          state.captureUrgent = !state.captureUrgent;
          updateCaptureToggleUI();
        });

        els.btnToggleStartPostponed.addEventListener('click', () => {
          state.captureStartPostponed = !state.captureStartPostponed;
          updateCaptureToggleUI();
        });

        // Dashboard Status Tabs
        els.statusTabs.addEventListener('click', (e) => {
          const tab = e.target.closest('.stat-tab');
          if (!tab) return;
          state.filterStatus = tab.dataset.status;
          renderAll();
        });

        // Instant Search
        els.searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          els.btnClearSearch.classList.toggle('visible', state.searchQuery.length > 0);
          renderAll();
        });

        els.btnClearSearch.addEventListener('click', () => {
          state.searchQuery = '';
          els.searchInput.value = '';
          els.btnClearSearch.classList.remove('visible');
          els.searchInput.focus();
          renderAll();
        });

        // Urgent Only Filter
        els.btnFilterUrgent.addEventListener('click', () => {
          state.filterUrgentOnly = !state.filterUrgentOnly;
          renderAll();
        });

        // Tag Filter Strip & Reset Button
        els.filterCategories.addEventListener('click', (e) => {
          const catBtn = e.target.closest('[data-filter-cat]');
          if (catBtn) {
            state.filterCategory = catBtn.dataset.filterCat;
            renderAll();
            return;
          }
          if (e.target.closest('#btnResetFilters')) {
            state.filterCategory = 'الكل';
            state.filterUrgentOnly = false;
            state.searchQuery = '';
            els.searchInput.value = '';
            els.btnClearSearch.classList.remove('visible');
            renderAll();
          }
        });

        // Event Delegation for Note Card Actions
        els.notesList.addEventListener('click', (e) => {
          const actionBtn = e.target.closest('[data-action]');
          if (!actionBtn) return;
          const card = actionBtn.closest('.note-card');
          if (!card) return;

          const id = card.dataset.id;
          const action = actionBtn.dataset.action;

          if (action === 'complete') toggleComplete(id);
          else if (action === 'postpone') togglePostpone(id);
          else if (action === 'edit') openEditModal(id);
          else if (action === 'delete') deleteNote(id);
        });

        // Edit Modal Submit
        els.editForm.addEventListener('submit', saveEditForm);

        // Confirm Clear Completed Action
        els.btnConfirmAction.addEventListener('click', executeClearCompleted);

        // Import Modal Choices
        els.btnImportMerge.addEventListener('click', () => executeImport('merge'));
        els.btnImportReplace.addEventListener('click', () => executeImport('replace'));

        // Modal Close Buttons & Backdrop Click
        document.querySelectorAll('[data-close-modal]').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-close-modal');
            const modalEl = document.getElementById(targetId);
            if (modalEl) closeModal(modalEl);
          });
        });

        [els.editModal, els.confirmModal, els.importModal].forEach(modalEl => {
          modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) closeModal(modalEl);
          });
        });

        // Keyboard Shortcuts (Escape to close modals/menus, "/" to focus search)
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeAllModals();
            closeToolsMenu();
          } else if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
            e.preventDefault();
            els.searchInput.focus();
          }
        });
      }

      /* ----------------------------------------------------------------------
         Bootstrap Application
         ---------------------------------------------------------------------- */
      function init() {
        initTheme();
        loadItems();
        renderCaptureCategories();
        updateCaptureToggleUI();
        bindEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
